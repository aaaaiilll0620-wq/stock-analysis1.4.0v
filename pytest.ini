# ============================================================================
# Canonical pytest collection root.
#
# The repository — not the invocation — defines what "the test suite" is, so a
# recorded test result is reproducible from the commit alone. Without this,
# bare `python -m pytest -q` ABORTS during collection: pytest's default
# python_files patterns include `*_test.py`, which matches research scratch
# scripts outside tests/ (e.g. scripts/tej_funnel_test.py) that execute
# module-level I/O against absolute paths at import time.
#
# This pins the collection root ONLY. It deliberately does not widen or narrow
# discovery rules inside tests/, so the canonical suite is unchanged:
# `python -m pytest -q` and `python -m pytest -q tests/` collect and execute
# the same suite.
#
# Established 2026-08-18 during Repo & Provenance Finalization Closure.
# The scratch scripts themselves are classified separately under FNL-2 repo
# hygiene; they are NOT deleted or renamed to make collection pass.
# ============================================================================
[pytest]
testpaths = tests
